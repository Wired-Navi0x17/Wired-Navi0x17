name: Render profile

# GitHub has no "repository pinned" event, so the closest thing is polling.
# Every 15 minutes (GitHub may start scheduled runs late); the job only
# commits when a card actually changed. For an instant refresh use
# Actions > Render profile > Run workflow.
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - status.yml
      - build.py
      - assets/fonts/**
      - assets/img/**
      - .github/workflows/profile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-commit
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards and pinned repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "render: refresh profile cards"
          git pull --rebase origin main
          git push
