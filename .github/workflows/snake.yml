name: Render contribution snake

on:
  schedule:
    - cron: "5 0 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-commit
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Colours follow the profile palette: paper-white snake, blood-red cells on ink.
      # The README always shows the dark one; the light file is kept for reuse.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#f4f2ed&color_dots=#1c1c1c,#3a0a12,#7d0e1b,#c8102e,#f0384b
            assets/snake-light.svg?color_snake=#0b0b0b&color_dots=#ebedf0,#f3c4ca,#e0788a,#c8102e,#5c0a14

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-dark.svg assets/snake-light.svg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "render: refresh contribution snake"
          git pull --rebase origin main
          git push
